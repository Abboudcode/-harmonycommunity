<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Story – Harmony Community</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Read a story on Harmony Community." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f5f7fb;
      --bg-card: #ffffff;
      --primary: #4b6fff;
      --primary-soft: #e2e7ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-soft: #e5e7eb;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #eef2ff, #f9fafb 40%);
      color: var(--text-main);
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .max-w { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: linear-gradient(180deg, #050817, #0f172a);
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 0;
      gap: 1rem;
    }

    .nav-left { display: flex; align-items: center; gap: 0.5rem; }
    .logo-wrapper { display: flex; align-items: center; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .nav-links a {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-links a:hover { background: rgba(148, 163, 184, 0.22); color: #ffffff; }
    .nav-links a.active { background: rgba(129, 140, 248, 0.35); color: #ffffff; }

    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .nav-ghost { font-size: 0.9rem; color: #cbd5f5; white-space: nowrap; }

    .language-select {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: #e5e7eb;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      outline: none;
      cursor: pointer;
    }
    .language-select option { color: #111827; background: #ffffff; }
    @media (max-width: 720px) { .nav-links { display: none; } }

    main { padding: 2.4rem 0 2.2rem; }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      padding: 1.3rem 1.3rem 1.15rem;
      max-width: 920px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      background: #eef2ff;
      color: #4f46e5;
    }

    .back-btn {
      border: 1px solid var(--border-soft);
      background: #ffffff;
      border-radius: 999px;
      padding: 0.38rem 0.8rem;
      font-size: 0.86rem;
      color: #334155;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .back-btn:hover { background: #f8fafc; border-color: #dbe2ea; }

    h1 {
      font-size: 1.8rem;
      line-height: 1.2;
      margin-bottom: 0.55rem;
      word-break: break-word;
    }

    .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .content {
      font-size: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1.15rem;
    }

    .error {
      display: none;
      margin: 0.9rem auto 0;
      max-width: 920px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
    }

    /* Media (shows if story has media_url) */
    .media-wrap {
      margin: 0.7rem 0 1.1rem;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0b1220;
    }
    .media-wrap img { width: 100%; display: block; height: auto; background: #0b1220; }
    .media-wrap video { width: 100%; display: block; background: #0b1220; }
    .media-caption {
      padding: 0.6rem 0.8rem;
      color: #e5e7eb;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.35);
    }

    /* Owner menu (top-right of the post) */
    .top-right { display: flex; align-items: center; gap: 0.5rem; position: relative; }
    .menu-btn {
      width: 34px; height: 34px; border-radius: 999px;
      border: 1px solid #c7d2fe; background: #eef2ff; color: var(--text-main);
      font-size: 1rem; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .menu-btn:hover { background: #e2e7ff; }
    .owner-menu {
      position: absolute; top: 42px; inset-inline-end: 0; z-index: 30;
      background: #ffffff; border: 1px solid var(--border-soft); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16);
      min-width: 190px; padding: 0.35rem; display: none;
    }
    .owner-menu.open { display: block; }
    .owner-menu button {
      display: block; width: 100%; text-align: start;
      background: none; border: none; border-radius: 8px;
      padding: 0.55rem 0.7rem; font-size: 0.92rem; cursor: pointer; color: var(--text-main);
    }
    .owner-menu button:hover { background: #f8fafc; }
    .owner-menu button.danger { color: #dc2626; }

    /* Story edit form */
    .edit-form { display: none; margin-top: 1rem; border-top: 1px solid var(--border-soft); padding-top: 1rem; }
    .edit-form.open { display: block; }
    .edit-form input, .edit-form textarea {
      width: 100%; border: 1px solid var(--border-soft); border-radius: 12px;
      padding: 0.6rem 0.75rem; font: inherit; font-size: 0.95rem; margin-bottom: 0.6rem;
      background: #fff; color: var(--text-main);
    }
    .edit-form textarea { min-height: 120px; resize: vertical; }
    .btn-primary {
      background: var(--primary); color: #fff; border: none; border-radius: 999px;
      padding: 0.6rem 1.1rem; font-size: 0.92rem; font-weight: 600; cursor: pointer; width: 100%;
    }
    .btn-secondary {
      background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 999px;
      padding: 0.55rem 1.1rem; font-size: 0.92rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 0.5rem;
    }
    .story-status { font-size: 0.88rem; font-weight: 600; margin-top: 0.6rem; display: none; }
    .story-status.ok { color: #059669; }
    .story-status.err { color: #dc2626; }

    /* Comments */
    .comments { margin-top: 0.6rem; padding-top: 0.9rem; border-top: 1px solid var(--border-soft); }
    .comments-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .comments-head h2 { font-size: 1.05rem; margin: 0; }
    .link-btn { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 0.85rem; cursor: pointer; padding: 0.2rem 0.3rem; }
    .comments-hint { color: var(--text-muted); font-size: 0.82rem; margin-top: 0.15rem; }
    .comment-status { font-size: 0.88rem; font-weight: 600; margin-top: 0.45rem; display: none; }
    .comment-status.ok { color: #059669; }
    .comment-status.err { color: #dc2626; }
    .composer { display: none; gap: 0.5rem; align-items: flex-end; margin-top: 0.7rem; }
    .composer.open { display: flex; }
    .composer textarea {
      flex: 1; border: 1px solid var(--border-soft); border-radius: 999px;
      padding: 0.55rem 0.9rem; font: inherit; font-size: 0.95rem; resize: none;
      max-height: 110px; color: var(--text-main); background: #fff;
    }
    .post-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 999px;
      padding: 0.55rem 1.05rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .post-btn:disabled { opacity: 0.5; cursor: default; }
    .comment-row { display: flex; gap: 0.65rem; padding-top: 0.9rem; margin-top: 0.9rem; border-top: 1px solid var(--border-soft); }
    .comment-avatar {
      width: 36px; height: 36px; border-radius: 999px; flex: none;
      background: #eef2ff; border: 1px solid #c7d2fe; color: #4f46e5;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem;
    }
    .comment-main { flex: 1; min-width: 0; }
    .comment-meta { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .comment-name { font-weight: 700; font-size: 0.9rem; }
    .comment-time { color: var(--text-muted); font-size: 0.78rem; }
    .comment-body { font-size: 0.94rem; line-height: 1.55; margin-top: 0.1rem; white-space: pre-wrap; word-break: break-word; }
    .comment-actions { display: flex; gap: 1rem; margin-top: 0.35rem; }
    .comment-actions button { background: none; border: none; font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 0; color: var(--primary); }
    .comment-actions button.danger { color: #dc2626; }
    .comment-edit textarea {
      width: 100%; border: 1px solid var(--border-soft); border-radius: 12px;
      padding: 0.55rem 0.7rem; font: inherit; font-size: 0.92rem; min-height: 60px; resize: vertical;
    }
    .comments-empty { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 1rem; }
    .comments-more { display: none; margin: 0.9rem auto 0; }

    /* Social: author, reaction, sharing (added 2026-10-27) */
    .author-row { display: flex; align-items: center; gap: 0.65rem; margin-top: 0.4rem; padding-top: 0.9rem; border-top: 1px solid var(--border-soft); }
    .author-main { flex: 1; min-width: 0; font-size: 0.92rem; }
    .author-name { font-weight: 700; }
    .friend-actions { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .friend-state { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
    .social { margin-top: 1rem; padding-top: 0.95rem; border-top: 1px solid var(--border-soft); }
    .social-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .social-btn {
      background: #ffffff; border: 1px solid #c7d2fe; color: #4f46e5; border-radius: 999px;
      padding: 0.5rem 1rem; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.35rem; font-family: inherit;
    }
    .social-btn:hover { background: #eef2ff; }
    .social-btn.active { background: #eef2ff; border-color: #4f46e5; color: #4f46e5; }
    .reaction-wrap { position: relative; display: inline-flex; align-items: center; }
    .reaction-caret { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 0.35rem 0.3rem; font-family: inherit; }
    .reaction-summary { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.45rem; display: none; align-items: center; gap: 0.3rem; }
    .reaction-picker {
      position: absolute; bottom: calc(100% + 8px); inset-inline-start: 0; background: #ffffff;
      border: 1px solid var(--border-soft); border-radius: 999px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      padding: 0.3rem 0.45rem; display: flex; gap: 0.15rem; z-index: 40;
    }
    .reaction-picker button { background: none; border: none; font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0.25rem; border-radius: 999px; font-family: inherit; }
    .reaction-picker button:hover { background: #eef2ff; transform: scale(1.15); }
    .reaction-emoji-gray { filter: grayscale(1); opacity: 0.65; }
    .social-btn.small { padding: 0.35rem 0.8rem; font-size: 0.82rem; }
    .social-btn:disabled { opacity: 0.55; cursor: default; }
    .social-note { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.4rem; }
    .social-status { font-size: 0.86rem; font-weight: 600; margin-top: 0.45rem; display: none; }
    .social-status.ok { color: #059669; }
    .social-status.err { color: #dc2626; }
    .share-panel { margin-top: 0.8rem; border: 1px solid var(--border-soft); border-radius: 12px; padding: 0.85rem; }
    .share-panel-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.55rem; }
    .share-panel textarea {
      width: 100%; border: 1px solid var(--border-soft); border-radius: 12px;
      padding: 0.55rem 0.7rem; font: inherit; font-size: 0.92rem; resize: vertical;
    }
    .friend-pick-row { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0; border-top: 1px solid var(--border-soft); }
    .friend-pick-name { flex: 1; min-width: 0; font-weight: 600; font-size: 0.92rem; }

    footer {
      padding: 1.5rem 0 1.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
    }
  </style>
<link rel="stylesheet" href="site-fixes.css">
</head>

<body>
  <div class="page">
    <header>
      <div class="max-w nav">
        <div class="nav-left">
          <div class="logo-wrapper">
            <!-- ✅ Correct Harmony logo -->
            <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg" aria-label="Harmony logo" role="img">
              <path d="M10 22 C25 5, 55 5, 70 22" fill="none" stroke="#40cbb4" stroke-width="3" stroke-linecap="round" />
              <path d="M12 22 L22 22 L27 15 L33 30 L38 22 L68 22" fill="none" stroke="#f5c451" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              <text x="78" y="27" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Harmony</text>
            </svg>
          </div>
        </div>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a>
          <a href="stories.html" class="active" data-en="Stories" data-ar="القصص">Stories</a>
          <a href="reels.html" data-en="Reels" data-ar="ريلز">Reels</a>
          <a href="share.html" data-en="Share a Story" data-ar="شارك قصة">Share a Story</a>
          <a href="signin.html" data-en="Profile" data-ar="الملف الشخصي">Profile</a>
          <a href="about.html" data-en="About" data-ar="عن هارموني">About</a>
          <a href="faq.html" data-en="FAQ" data-ar="الأسئلة الشائعة">FAQ</a>
          <a href="contact.html" data-en="Contact" data-ar="اتصال">Contact</a>
        </nav>

        <div class="nav-right">
          <select id="language-select" class="language-select" aria-label="Language selector">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
          <div id="nav-auth-label" class="nav-ghost" data-en="Not signed in" data-ar="غير مسجّل">Not signed in</div>
        </div>
      </div>
    </header>

    <main>
      <div class="card" aria-live="polite">
        <div class="top-row">
          <span id="story-category" class="tag">—</span>
          <div class="top-right">
            <button id="back-btn" class="back-btn" type="button" data-en="← Back to Stories" data-ar="رجوع إلى القصص">← Back to Stories</button>
            <button id="owner-menu-btn" class="menu-btn" type="button" style="display:none" aria-label="Story options">•••</button>
            <div id="owner-menu" class="owner-menu">
              <button id="owner-edit" type="button" data-en="Edit my story" data-ar="تعديل قصتي">Edit my story</button>
              <button id="owner-delete" type="button" class="danger" data-en="Delete my story" data-ar="حذف قصتي">Delete my story</button>
            </div>
          </div>
        </div>

        <h1 id="story-title">…</h1>

        <div class="meta">
          <span id="story-date">—</span>
          <span id="story-visibility">—</span>
        </div>

        <!-- Media -->
        <div id="story-media" style="display:none;"></div>

        <div id="story-content" class="content"></div>

        <!-- Owner story edit form (opened from the top-right menu) -->
        <div id="story-edit-form" class="edit-form">
          <input id="edit-title" type="text" maxlength="160" />
          <textarea id="edit-content" maxlength="10000"></textarea>
          <button id="edit-save" class="btn-primary" type="button" data-en="Save story" data-ar="حفظ القصة">Save story</button>
          <button id="edit-cancel" class="btn-secondary" type="button" data-en="Cancel" data-ar="إلغاء">Cancel</button>
          <div id="story-status" class="story-status"></div>
        </div>

        <!-- Author (shown when the story is not anonymous and a profile exists) -->
        <div id="author-row" class="author-row" style="display:none">
          <div class="comment-avatar" id="author-avatar">?</div>
          <div class="author-main">
            <span id="author-by"></span>
            <span class="author-name" id="author-name"></span>
          </div>
          <div id="author-friend-actions" class="friend-actions"></div>
        </div>

        <!-- Social: Happened to me + sharing -->
        <div id="social-row" class="social" style="display:none">
          <div id="reaction-summary" class="reaction-summary"></div>
          <div class="social-actions">
            <div class="reaction-wrap" id="reaction-wrap">
              <button id="reaction-btn" class="social-btn" type="button" style="display:none" aria-pressed="false"><span id="reaction-label"></span></button>
              <button id="reaction-caret" class="reaction-caret" type="button" style="display:none" aria-label="Choose a reaction" aria-haspopup="true">▾</button>
              <div id="reaction-picker" class="reaction-picker" style="display:none" role="menu"></div>
            </div>
            <button id="comment-btn" class="social-btn" type="button">Comment</button>
            <button id="share-btn" class="social-btn" type="button" data-en="Share story" data-ar="مشاركة القصة">Share story</button>
            <button id="send-friend-btn" class="social-btn" type="button" style="display:none" data-en="Send to a friend" data-ar="إرسال إلى صديق">Send to a friend</button>
            <button id="report-btn" class="social-btn" type="button" style="display:none" data-en="Report" data-ar="إبلاغ">Report</button>
          </div>
          <div id="reaction-note" class="social-note"></div>
          <div id="social-status" class="social-status"></div>
          <div id="share-panel" class="share-panel" style="display:none">
            <div class="share-panel-title" data-en="Send to a friend" data-ar="إرسال إلى صديق">Send to a friend</div>
            <textarea id="share-message" maxlength="300" rows="2"></textarea>
            <div id="share-friends-list" style="margin-top:0.4rem;"></div>
            <div id="share-panel-status" class="social-status"></div>
            <button id="share-panel-close" class="link-btn" type="button" style="margin-top:0.5rem;" data-en="Close" data-ar="إغلاق">Close</button>
          </div>
        </div>

        <!-- Comments -->
        <div class="comments" id="comments-section">
          <div class="comments-head">
            <h2 id="comments-title">Supportive comments</h2>
            <span style="display:flex;gap:1rem;align-items:center">
              <button id="comments-refresh" class="link-btn" type="button" data-en="Refresh" data-ar="تحديث">Refresh</button>
              <button id="comments-toggle" class="link-btn" type="button" style="display:none">Show less</button>
            </span>
          </div>
          <div class="comments-hint" data-en="Be kind — comments are public." data-ar="كن لطيفاً — التعليقات ظاهرة للجميع.">Be kind — comments are public.</div>
          <div id="comment-status" class="comment-status"></div>
          <div class="composer" id="comment-composer">
            <textarea id="comment-input" rows="1" maxlength="4000"></textarea>
            <button id="comment-post" class="post-btn" type="button" disabled data-en="Post" data-ar="نشر">Post</button>
          </div>
          <div class="comments-hint" id="comment-signin-note" style="display:none">
            <span data-en="Sign in to join the conversation." data-ar="سجّل الدخول للمشاركة في الحوار.">Sign in to join the conversation.</span>
            <a href="signin.html" style="color:var(--primary);font-weight:600" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</a>
          </div>
          <div id="comments-list"></div>
          <button id="comments-view-all" class="link-btn comments-more" type="button" style="display:none">View all comments</button>
          <button id="comments-more" class="link-btn comments-more" type="button" data-en="Load more" data-ar="تحميل المزيد">Load more</button>
        </div>
      </div>

      <div id="story-error" class="error"></div>
    </main>

    <footer>Harmony Community © 2025</footer>
  </div>

  <script src="site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
  <script src="site-utils.js"></script>

  <script>
    (function () {
      const LANG_KEY = "harmony_lang";

      const langSelect = document.getElementById("language-select");
      const navAuthLabel = document.getElementById("nav-auth-label");

      const elCategory = document.getElementById("story-category");
      const elTitle = document.getElementById("story-title");
      const elDate = document.getElementById("story-date");
      const elVisibility = document.getElementById("story-visibility");
      const elContent = document.getElementById("story-content");
      const elError = document.getElementById("story-error");
      const backBtn = document.getElementById("back-btn");

      const mediaHost = document.getElementById("story-media");

      let currentLang = "en";

      let comments = [];

      // Emoji reactions (Facebook style): ONE reaction per person per
      // story. Picking another emoji replaces yours; picking yours again
      // removes it. Kinds are widened by add-emoji-reactions.sql — until
      // that runs, only 'happened_to_me' writes succeed and failures just
      // show the quiet social status line.
      const REACTIONS = [
        { kind: "like", emoji: "👍", en: "Like", ar: "إعجاب" },
        { kind: "love", emoji: "❤️", en: "Love", ar: "حب" },
        { kind: "happened_to_me", emoji: "🤝", en: "Happened to me", ar: "صار معي" },
        { kind: "support", emoji: "🫂", en: "Support", ar: "دعم" },

      function tx(en, ar) { return currentLang === "ar" ? ar : en; }

      const SUPABASE_URL = window.HARMONY_SITE_CONFIG.url;

      function getInitialLang() {
        try {
          const saved = localStorage.getItem(LANG_KEY);
          if (saved === "ar" || saved === "en") return saved;
        } catch (e) {}
        return "en";
      }

      function applyLanguage(lang) {
        currentLang = lang;

        document.querySelectorAll("[data-en]").forEach((el) => {
          const en = el.getAttribute("data-en");
          const ar = el.getAttribute("data-ar") || en;
          el.textContent = lang === "ar" ? ar : en;
        });

        document.documentElement.lang = lang === "ar" ? "ar" : "en";
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      }

      function showError(msgEn, msgAr) {
        if (!elError) return;
        elError.style.display = "block";
        elError.textContent = currentLang === "ar" ? (msgAr || msgEn) : msgEn;
      }

      function escapeHtml(str) {
        return String(str || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function getIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id") || params.get("story") || params.get("story_id");
        if (id) return String(id).trim();

        // Also support links like story.html#123 in case we use them later.
        const hash = String(window.location.hash || "").replace("#", "").trim();
        return hash || "";
      }

      async function refreshUserLabel(langOverride) {
        const lang = langOverride || currentLang;

        try {
          const { data, error } = await supabase.auth.getUser();
          if (error || !data || !data.user) {
            if (navAuthLabel) {
              const en = navAuthLabel.getAttribute("data-en") || "Not signed in";
              const ar = navAuthLabel.getAttribute("data-ar") || en;
              navAuthLabel.textContent = lang === "ar" ? ar : en;
            }
            return;
          }

          const user = data.user;
          const meta = user.user_metadata || {};
          const displayName = meta.display_name || "Member";
          const alwaysAnon = !!meta.always_anonymous;

          navAuthLabel.textContent = alwaysAnon
            ? (lang === "ar" ? "مسجّل: مجهول (الاسم مخفي)" : "Signed in: Anonymous (name hidden)")
            : (lang === "ar" ? "مسجّل: " + displayName : "Signed in: " + displayName);
        } catch (e) {}
      }

      function setStoryStatus(msg, isErr) {
        if (!storyStatus) return;
        storyStatus.style.display = msg ? "block" : "none";
        storyStatus.className = "story-status " + (isErr ? "err" : "ok");
        storyStatus.textContent = msg || "";
      }

      function setCommentStatus(msg, isErr) {
        if (!commentStatus) return;
        commentStatus.style.display = msg ? "block" : "none";
        commentStatus.className = "comment-status " + (isErr ? "err" : "ok");
        commentStatus.textContent = msg || "";
      }

      function isOwner() {
        return !!(currentUser && storyData && storyData.user_id && storyData.user_id === currentUser.id);
      }

      function updateOwnerUI() {
        if (ownerMenuBtn) ownerMenuBtn.style.display = isOwner() ? "inline-flex" : "none";
        if (!isOwner() && ownerMenu) ownerMenu.classList.remove("open");
        if (composer) composer.classList.toggle("open", !!currentUser && commentsExpanded);
        if (signinNote) signinNote.style.display = (!currentUser && commentsExpanded) ? "block" : "none";
      }

      function closeOwnerMenu() { if (ownerMenu) ownerMenu.classList.remove("open"); }

      async function deleteStory() {
        if (!isOwner()) return;
        if (!window.confirm(tx("Delete your story and its comments?", "هل تريد حذف قصتك وتعليقاتها؟"))) return;
        const { data, error } = await supabase
          .from("stories").delete()
          .eq("id", storyData.id).eq("user_id", currentUser.id)
          .select("id");
        if (error || !data || !data.length) {
          setStoryStatus(tx("Could not delete this story.", "تعذر حذف هذه القصة."), true);
          return;
        }
        window.location.href = "stories.html";
      }

      async function saveStoryEdit() {
        if (!isOwner()) return;
        const title = (editTitleInput.value || "").trim();
        const content = (editContentInput.value || "").trim();
        if (!title || !content) {
          setStoryStatus(tx("Title and story text are required.", "العنوان ونص القصة مطلوبان."), true);
          return;
        }
        const { data, error } = await supabase
          .from("stories").update({ title, content })
          .eq("id", storyData.id).eq("user_id", currentUser.id)
          .select().single();
        if (error || !data) {
          setStoryStatus(tx("Could not save this story.", "تعذر حفظ هذه القصة."), true);
          return;
        }
        storyData = data;
        elTitle.textContent = data.title || "";
        elContent.textContent = data.content || "";
        if (editForm) editForm.classList.remove("open");
        setStoryStatus(tx("Story saved.", "تم حفظ القصة."), false);
      }

      // ---------- Social: reaction, author friends, sharing ----------
      // All of these use the new tables from add-social-features.sql.
      // Every call is guarded: if a table does not exist yet, the matching
      // control is hidden (with a quiet note where useful) and the rest of
      // the page keeps working exactly as before.

      function setSocialStatus(msg, isErr) {
        if (!socialStatus) return;
        socialStatus.style.display = msg ? "block" : "none";
        socialStatus.className = "social-status " + (isErr ? "err" : "ok");
        socialStatus.textContent = msg || "";
      }

      function setSharePanelStatus(msg, isErr) {
        if (!sharePanelStatus) return;
        sharePanelStatus.style.display = msg ? "block" : "none";
        sharePanelStatus.className = "social-status " + (isErr ? "err" : "ok");
        sharePanelStatus.textContent = msg || "";
      }

      function storyLink() {
        return "https://abboudcode.github.io/-harmonycommunity/story.html?id=" + encodeURIComponent(String(storyId));
      }

      async function ensureOwnProfile() {
        if (!currentUser) return;
        try {
          const meta = currentUser.user_metadata || {};
          const name = (String(meta.display_name || "Member").trim().slice(0, 60)) || "Member";
          const res = await supabase.from("profiles").upsert(
            { id: currentUser.id, display_name: name },
            { onConflict: "id" }
          );
          if (res && res.error) throw res.error;
        } catch (e) {}
      }

      function reactionDef(kind) {
        return REACTIONS.find((r) => r.kind === kind) || null;
      }

      function renderSummary() {
        if (!reactionSummary) return;
        if (!reactionAvailable || !reactionTotal) {
          reactionSummary.style.display = "none";
          reactionSummary.textContent = "";
          return;
        }
        const top = REACTIONS
          .filter((r) => reactionCounts[r.kind])
          .sort((a, b) => (reactionCounts[b.kind] || 0) - (reactionCounts[a.kind] || 0))
          .slice(0, 3);
        reactionSummary.textContent = top.map((r) => r.emoji).join(" ") + " " + reactionTotal;
        reactionSummary.style.display = "flex";
      }

      function renderReaction() {
        if (!reactionBtn) return;
        reactionBtn.style.display = reactionAvailable ? "inline-flex" : "none";
        if (reactionCaret) reactionCaret.style.display = reactionAvailable ? "inline-block" : "none";
        if (!reactionAvailable && reactionPicker) reactionPicker.style.display = "none";
        const mine = reactionDef(reactionMyKind);
        if (reactionLabel) {
          reactionLabel.innerHTML = mine
            ? escapeHtml(mine.emoji) + " " + escapeHtml(tx(mine.en, mine.ar))
            : '<span class="reaction-emoji-gray">👍</span> ' + escapeHtml(tx("Happened to me", "صار معي"));
        }
        reactionBtn.classList.toggle("active", !!mine);
        reactionBtn.setAttribute("aria-pressed", mine ? "true" : "false");
        renderSummary();
        renderPicker();
      }

      function renderPicker() {
        if (!reactionPicker) return;
        reactionPicker.innerHTML = REACTIONS.map((r) =>
          '<button type="button" data-kind="' + r.kind + '" title="' + escapeHtml(tx(r.en, r.ar)) +
          '" aria-label="' + escapeHtml(tx(r.en, r.ar)) + '">' + r.emoji + "</button>"
        ).join("");
      }

      function openPicker() {
        if (!reactionAvailable || !reactionPicker) return;
        renderPicker();
        reactionPicker.style.display = "flex";
      }

      function closePicker() {
        if (reactionPicker) reactionPicker.style.display = "none";
      }

      function pickerOpen() {
        return !!(reactionPicker && reactionPicker.style.display !== "none");
      }

      async function loadReaction() {
        reactionAvailable = false;
        reactionCounts = {};
        reactionTotal = 0;
        reactionMyKind = null;
        if (reactionNote) reactionNote.textContent = "";
        try {
          const res = await supabase
            .from("story_reactions").select("user_id, kind")
            .eq("story_id", storyId);
          if (res.error) throw res.error;
          const rows = Array.isArray(res.data) ? res.data : [];
          rows.forEach((r) => {
            if (reactionDef(r.kind)) reactionCounts[r.kind] = (reactionCounts[r.kind] || 0) + 1;
            if (currentUser && String(r.user_id) === String(currentUser.id)) reactionMyKind = r.kind;
          });
          reactionTotal = rows.length;
          reactionAvailable = true;
        } catch (e) {
          reactionAvailable = false;
          if (reactionNote) reactionNote.textContent = tx("Reactions are not available yet.", "التفاعلات غير متاحة بعد.");
        }
        renderReaction();
      }

      // Set / replace / remove the signed-in user's reaction.
      // Same kind again -> delete. Different kind -> update the row.
      // No reaction yet -> insert. Any failure (e.g. the emoji migration
      // has not run yet) only shows the quiet status line.
      async function setReaction(kind) {
        if (!reactionAvailable) return;
        if (!currentUser) {
          setSocialStatus(tx("Sign in to add your reaction.", "سجّل الدخول لإضافة تفاعلك."), true);
          return;
        }
        closePicker();
        try {
          let res;
          if (reactionMyKind === kind) {
            res = await supabase
              .from("story_reactions").delete()
              .eq("story_id", storyId).eq("user_id", currentUser.id);
          } else if (reactionMyKind) {
            res = await supabase
              .from("story_reactions").update({ kind })
              .eq("story_id", storyId).eq("user_id", currentUser.id);
          } else {
            res = await supabase
              .from("story_reactions")
              .insert({ story_id: storyId, user_id: currentUser.id, kind });
          }
          if (res && res.error) throw res.error;
          await loadReaction();
        } catch (e) {
          setSocialStatus(tx("Could not update your reaction.", "تعذر تحديث تفاعلك."), true);
        }
      }

      // Plain click on the main button: remove my reaction if I have
      // one, otherwise set the default 'happened_to_me'.
      async function toggleReaction() {
        if (!reactionAvailable) return;
        if (reactionMyKind) {
          await setReaction(reactionMyKind);
        } else {
          await setReaction(DEFAULT_REACTION);
        }
      }

      function friendActionBtn(label, action) {
        return '<button type="button" class="social-btn small" data-friend-action="' + action + '">' +
          escapeHtml(label) + "</button>";
      }

      function renderAuthorFriend() {
        if (!authorFriendActions) return;
        authorFriendActions.innerHTML = "";
        if (!currentUser || !authorProfile) return;
        if (String(authorProfile.id) === String(currentUser.id)) return;
        const r = authorRel;
        if (!r || r.status === "declined") {
          authorFriendActions.innerHTML = friendActionBtn(tx("Add Friend", "إضافة صديق"), "add");
          return;
        }
        if (r.status === "accepted") {
          authorFriendActions.innerHTML =
            '<span class="friend-state">' + escapeHtml(tx("Friends", "أصدقاء")) + "</span>" +
            friendActionBtn(tx("Remove", "إزالة"), "remove");
          return;
        }
        if (r.status === "pending") {
          if (String(r.requester_id) === String(currentUser.id)) {
            authorFriendActions.innerHTML =
              '<span class="friend-state">' + escapeHtml(tx("Request sent", "تم إرسال الطلب")) + "</span>" +
              friendActionBtn(tx("Cancel", "إلغاء"), "cancel");
          } else {
            authorFriendActions.innerHTML =
              friendActionBtn(tx("Accept request", "قبول الطلب"), "accept") +
              friendActionBtn(tx("Decline", "رفض"), "decline");
          }
        }
      }

      async function loadAuthorRel() {
        authorRel = null;
        if (!currentUser || !authorProfile) return;
        if (String(authorProfile.id) === String(currentUser.id)) return;
        try {
          const me = currentUser.id;
          const other = authorProfile.id;
          const res = await supabase
            .from("friend_requests").select("*")
            .or("and(requester_id.eq." + me + ",addressee_id.eq." + other + "),and(requester_id.eq." + other + ",addressee_id.eq." + me + ")");
          if (res.error) throw res.error;
          const rows = Array.isArray(res.data) ? res.data : [];
          authorRel =
            rows.find((r) => r.status === "accepted") ||
            rows.find((r) => r.status === "pending") ||
            rows[0] || null;
        } catch (e) {
          authorRel = null;
        }
      }

      async function loadAuthor() {
        authorProfile = null;
        authorRel = null;
        if (authorRow) authorRow.style.display = "none";
        if (!storyData || storyData.is_anonymous || !storyData.user_id) return;
        try {
          const res = await supabase
            .from("profiles").select("id, display_name")
            .eq("id", storyData.user_id).maybeSingle();
          if (res.error) throw res.error;
          if (!res.data) return;
          authorProfile = res.data;
        } catch (e) {
          return;
        }
        if (authorByEl) authorByEl.textContent = tx("Story by ", "قصة بقلم ");
        if (authorNameEl) authorNameEl.textContent = authorProfile.display_name || tx("Member", "عضو");
        if (authorAvatar) {
          authorAvatar.textContent = (String(authorProfile.display_name || "?").trim().charAt(0) || "?").toUpperCase();
        }
        if (authorRow) authorRow.style.display = "flex";
        await loadAuthorRel();
        renderAuthorFriend();
      }

      async function authorFriendAction(action) {
        if (!currentUser || !authorProfile) return;
        const other = authorProfile.id;
        const me = currentUser.id;
        try {
          if (action === "add") {
            await ensureOwnProfile();
            if (authorRel && authorRel.status === "declined") {
              const d = await supabase.from("friend_requests").delete().eq("id", authorRel.id);
              if (d && d.error) throw d.error;
            }
            const res = await supabase
              .from("friend_requests")
              .insert({ requester_id: me, addressee_id: other, status: "pending" });
            if (res && res.error) throw res.error;
            setSocialStatus(tx("Friend request sent.", "تم إرسال طلب الصداقة."), false);
          } else if (action === "cancel" || action === "remove") {
            if (!authorRel) return;
            if (action === "remove" && !window.confirm(tx("Remove this friend?", "هل تريد إزالة هذا الصديق؟"))) return;
            const d = await supabase.from("friend_requests").delete().eq("id", authorRel.id);
            if (d && d.error) throw d.error;
            setSocialStatus(
              action === "remove"
                ? tx("Friend removed.", "تمت إزالة الصديق.")
                : tx("Request cancelled.", "تم إلغاء الطلب."),
              false
            );
          } else if (action === "accept" || action === "decline") {
            if (!authorRel) return;
            const res = await supabase
              .from("friend_requests")
              .update({
                status: action === "accept" ? "accepted" : "declined",
                responded_at: new Date().toISOString(),
              })
              .eq("id", authorRel.id);
            if (res && res.error) throw res.error;
            setSocialStatus(
              action === "accept"
                ? tx("You are now friends.", "أصبحتما أصدقاء الآن.")
                : tx("Request declined.", "تم رفض الطلب."),
              false
            );
          } else {
            return;
          }
          await loadAuthorRel();
          renderAuthorFriend();
        } catch (e) {
          setSocialStatus(tx("That did not work. Friends may not be available yet.", "لم ينجح ذلك. قد لا تكون الصداقة متاحة بعد."), true);
        }
      }

      // Report a story or a comment (store requirement for user content,
      // parity with the app). Rows land in content_reports
      // (add-reports-and-account-deletion.sql); the owner reviews them in
      // the Supabase dashboard. Until that SQL runs this fails with a
      // friendly message. Real user = signed in and not an anonymous
      // guest account — the always_anonymous display flag must NOT gate
      // this (same rule as reactions / app social-9).
      async function reportContent(target, forComment) {
        const say = forComment ? setCommentStatus : setSocialStatus;
        if (!currentUser || currentUser.is_anonymous) {
          say(tx("Sign in to report this.", "سجّل الدخول للإبلاغ عن هذا."), true);
          return;
        }
        if (!window.confirm(tx("Report this to the Harmony team? We will review it and remove it if it breaks the rules.", "إبلاغ فريق هارموني عن هذا؟ سنراجعه ونحذفه إذا خالف القواعد."))) return;
        try {
          const { error } = await supabase.from("content_reports").insert({
            reporter_id: currentUser.id,
            story_id: target.storyId != null ? Number(target.storyId) : null,
            comment_id: target.commentId != null ? Number(target.commentId) : null,
            reason: "Reported on Harmony website",
          });
          if (error) throw error;
          say(tx("Thank you — this was reported. We will review it.", "شكراً — تم إرسال البلاغ. سنراجعه."), false);
        } catch (e) {
          say(tx("Could not send the report yet. Please try again later.", "تعذر إرسال البلاغ الآن. حاول مرة أخرى لاحقاً."), true);
        }
      }

      async function shareOutside() {
        const url = storyLink();
        const title = storyData ? (storyData.title || "Harmony story") : "Harmony story";
        if (navigator.share) {
          try {
            await navigator.share({ title, text: title, url });
            return;
          } catch (e) {
            if (e && e.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(url);
          setSocialStatus(tx("Link copied.", "تم نسخ الرابط."), false);
          return;
        } catch (e) {}
        try {
          const ta = document.createElement("textarea");
          ta.value = url;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          setSocialStatus(tx("Link copied.", "تم نسخ الرابط."), false);
        } catch (e) {
          setSocialStatus(url, false);
        }
      }

      async function loadShareFriends() {
        if (!shareFriendsList) return;
        shareFriendsList.innerHTML =
          '<div class="comments-empty">' + escapeHtml(tx("Loading friends…", "جاري تحميل الأصدقاء…")) + "</div>";
        try {
          const me = currentUser.id;
          const res = await supabase
            .from("friend_requests").select("*")
            .eq("status", "accepted")
            .or("requester_id.eq." + me + ",addressee_id.eq." + me);
          if (res.error) throw res.error;
          const rows = Array.isArray(res.data) ? res.data : [];
          const ids = [];
          rows.forEach((r) => {
            const other = String(r.requester_id) === String(me) ? r.addressee_id : r.requester_id;
            if (!ids.some((x) => String(x) === String(other))) ids.push(other);
          });
          if (!ids.length) {
            shareFriendsList.innerHTML =
              '<div class="comments-empty">' +
              escapeHtml(tx("You have no friends yet. Add friends from your Profile page.", "لا أصدقاء بعد. أضف أصدقاء من صفحة ملفك الشخصي.")) +
              "</div>";
            return;
          }
          const pres = await supabase.from("profiles").select("id, display_name").in("id", ids);
          if (pres.error) throw pres.error;
          const names = new Map((pres.data || []).map((p) => [String(p.id), p.display_name || tx("Member", "عضو")]));
          shareFriendsList.innerHTML = ids.map((id) => {
            const name = names.get(String(id)) || tx("Member", "عضو");
            const sent = sentShareIds.has(String(id));
            return (
              '<div class="friend-pick-row">' +
                '<div class="comment-avatar">' + escapeHtml((String(name).trim().charAt(0) || "?").toUpperCase()) + "</div>" +
                '<div class="friend-pick-name">' + escapeHtml(name) + "</div>" +
                '<button type="button" class="social-btn small" data-send-to="' + escapeHtml(String(id)) + '"' +
                  (sent ? " disabled" : "") + ">" +
                  escapeHtml(sent ? tx("Sent", "تم الإرسال") : tx("Send", "إرسال")) +
                "</button>" +
              "</div>"
            );
          }).join("");
        } catch (e) {
          shareFriendsList.innerHTML =
            '<div class="comments-empty">' +
            escapeHtml(tx("Sharing with friends is not available yet.", "المشاركة مع الأصدقاء غير متاحة بعد.")) +
            "</div>";
        }
      }

      async function sendStoryToFriend(toId, btn) {
        if (!currentUser) return;
        if (btn) btn.disabled = true;
        try {
          await ensureOwnProfile();
          const msg = shareMessageInput ? (shareMessageInput.value || "").trim().slice(0, 300) : "";
          const res = await supabase
            .from("story_shares")
            .insert({
              story_id: storyId,
              from_user_id: currentUser.id,
              to_user_id: toId,
              message: msg || null,
            });
          if (res && res.error) throw res.error;
          sentShareIds.add(String(toId));
          setSharePanelStatus(tx("Story sent.", "تم إرسال القصة."), false);
          await loadShareFriends();
        } catch (e) {
          if (btn) btn.disabled = false;
          setSharePanelStatus(tx("Could not send this story.", "تعذر إرسال هذه القصة."), true);
        }
      }

      function wireSocial() {
        if (reactionBtn) {
          // Long-press (touch/mouse hold) opens the emoji picker; the
          // click that follows a long-press must not also toggle.
          let pressTimer = null;
          let suppressClick = false;
          reactionBtn.addEventListener("pointerdown", () => {
            pressTimer = setTimeout(() => { suppressClick = true; openPicker(); }, 550);
          });
          ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
            reactionBtn.addEventListener(ev, () => {
              if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            })
          );
          reactionBtn.addEventListener("click", () => {
            if (suppressClick) { suppressClick = false; return; }
            toggleReaction();
          });
        }
        if (reactionWrap) {
          // Hovering the reaction button ~600ms opens the picker too.
          let hoverTimer = null;
          let closeTimer = null;
          reactionWrap.addEventListener("mouseenter", () => {
            if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
            hoverTimer = setTimeout(openPicker, 600);
          });
          reactionWrap.addEventListener("mouseleave", () => {
            if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
            closeTimer = setTimeout(closePicker, 300);
          });
        }
        if (reactionCaret) {
          reactionCaret.addEventListener("click", (e) => {
            e.stopPropagation();
            if (pickerOpen()) closePicker(); else openPicker();
          });
        }
        if (reactionPicker) {
          reactionPicker.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-kind]");
            if (!btn) return;
            setReaction(btn.getAttribute("data-kind"));
          });
        }
        document.addEventListener("click", (e) => {
          if (reactionWrap && !reactionWrap.contains(e.target)) closePicker();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closePicker();
        });
        if (shareBtn) shareBtn.addEventListener("click", shareOutside);
        if (reportBtn) reportBtn.addEventListener("click", () => { void reportContent({ storyId: storyId }, false); });
        if (sendFriendBtn) {
          sendFriendBtn.addEventListener("click", () => {
            if (!currentUser) {
              setSocialStatus(tx("Sign in to send this story to a friend.", "سجّل الدخول لإرسال هذه القصة إلى صديق."), true);
              return;
            }
            if (!sharePanel) return;
            const open = sharePanel.style.display !== "none";
            sharePanel.style.display = open ? "none" : "block";
            if (!open) {
              setSharePanelStatus("", false);
              loadShareFriends();
            }
          });
        }
        if (sharePanelClose) {
          sharePanelClose.addEventListener("click", () => {
            if (sharePanel) sharePanel.style.display = "none";
          });
        }
        if (authorFriendActions) {
          authorFriendActions.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-friend-action]");
            if (!btn) return;
            authorFriendAction(btn.getAttribute("data-friend-action"));
          });
        }
        if (shareFriendsList) {
          shareFriendsList.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-send-to]");
            if (!btn || btn.disabled) return;
            sendStoryToFriend(btn.getAttribute("data-send-to"), btn);
          });
        }
      }

      function commentName(c) {
        return c.is_anonymous ? tx("Anonymous", "مجهول") : (c.author_name || tx("Member", "عضو"));
      }

      function formatWhen(dateStr) {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString() + " · " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function renderComments() {
        if (commentsTitle) {
          commentsTitle.textContent = tx("Supportive comments", "تعليقات داعمة") + (comments.length ? " (" + comments.length + ")" : "");
        }
        if (commentBtn) {
          commentBtn.textContent = tx("Comment", "تعليق") + (comments.length ? " " + comments.length : "");
        }
        if (commentsToggleBtn) {
          commentsToggleBtn.style.display = commentsExpanded ? "inline" : "none";
          commentsToggleBtn.textContent = tx("Show less", "عرض أقل");
        }
        if (commentsViewAllBtn) {
          commentsViewAllBtn.style.display = (!commentsExpanded && (comments.length > 1 || commentsHasMore)) ? "block" : "none";
          commentsViewAllBtn.textContent = tx("View all comments", "عرض كل التعليقات") + (comments.length ? " (" + comments.length + ")" : "");
        }
        if (commentsMoreBtn) commentsMoreBtn.style.display = (commentsExpanded && commentsHasMore) ? "block" : "none";
        updateOwnerUI();
        if (!commentsList) return;

        if (!comments.length) {
          commentsList.innerHTML = '<div class="comments-empty">' +
            escapeHtml(tx("No comments yet. Be the first to offer support.", "لا توجد تعليقات بعد. كن أول من يقدم الدعم.")) + "</div>";
          return;
        }

        const visibleComments = commentsExpanded ? comments : comments.slice(0, 1);
        commentsList.innerHTML = visibleComments.map((c) => {
          const name = commentName(c);
          const initial = (name.trim().charAt(0) || "?").toUpperCase();
          const own = !!(currentUser && c.user_id === currentUser.id);
          let inner = "";
          if (own && String(editingCommentId) === String(c.id)) {
            inner =
              '<div class="comment-edit">' +
                '<textarea id="comment-edit-input" maxlength="4000">' + escapeHtml(c.body || "") + "</textarea>" +
                '<div class="comment-actions">' +
                  '<button type="button" data-csave="' + c.id + '">' + escapeHtml(tx("Save", "حفظ")) + "</button>" +
                  '<button type="button" data-ccancel="1" style="color:var(--text-muted)">' + escapeHtml(tx("Cancel", "إلغاء")) + "</button>" +
                "</div>" +
              "</div>";
          } else {
            inner =
              '<div class="comment-body">' + escapeHtml(c.body || "") + "</div>" +
              (own
                ? '<div class="comment-actions">' +
                    '<button type="button" data-cedit="' + c.id + '">' + escapeHtml(tx("Edit", "تعديل")) + "</button>" +
                    '<button type="button" class="danger" data-cdel="' + c.id + '">' + escapeHtml(tx("Delete", "حذف")) + "</button>" +
                  "</div>"
                : '<div class="comment-actions">' +
                    '<button type="button" data-creport="' + c.id + '" style="color:var(--text-muted)">' + escapeHtml(tx("Report", "إبلاغ")) + "</button>" +
                  "</div>");
          }
          return (
            '<div class="comment-row">' +
              '<div class="comment-avatar">' + escapeHtml(initial) + "</div>" +
              '<div class="comment-main">' +
                '<div class="comment-meta"><span class="comment-name">' + escapeHtml(name) + "</span>" +
                '<span class="comment-time">' + escapeHtml(formatWhen(c.created_at)) + "</span></div>" +
                inner +
              "</div>" +
            "</div>"
          );
        }).join("");
      }

      async function loadComments(reset) {
        if (!storyId) return;
        const offset = reset ? 0 : commentsPage * 30;
        const { data, error } = await supabase
          .from("story_comments").select("*")
          .eq("story_id", storyId)
          .order("created_at", { ascending: false }).order("id", { ascending: false })
          .range(offset, offset + 29);
        if (error) {
          setCommentStatus(tx("Comments are unavailable right now.", "التعليقات غير متاحة حالياً."), true);
          return;
        }
        const rows = Array.isArray(data) ? data : [];
        if (reset) comments = rows;
        else {
          const seen = new Set(comments.map((r) => String(r.id)));
          rows.forEach((r) => { if (!seen.has(String(r.id))) comments.push(r); });
        }
        commentsPage = reset ? 1 : commentsPage + 1;
        commentsHasMore = rows.length === 30;
        renderComments();
      }

      async function postComment() {
        if (!currentUser) return;
        const body = (commentInput.value || "").trim();
        if (!body) return;
        const meta = currentUser.user_metadata || {};
        const alwaysAnon = !!meta.always_anonymous;
        commentPostBtn.disabled = true;
        const { error } = await supabase.from("story_comments").insert({
          story_id: storyId,
          body,
          user_id: currentUser.id,
          is_anonymous: alwaysAnon,
          author_name: alwaysAnon ? "Anonymous" : (meta.display_name || "Member"),
        }).select().single();
        commentPostBtn.disabled = !((commentInput.value || "").trim());
        if (error) {
          setCommentStatus(String(error.message || error), true);
          return;
        }
        commentInput.value = "";
        commentPostBtn.disabled = true;
        setCommentStatus(tx("Comment posted.", "تم نشر التعليق."), false);
        editingCommentId = null;
        await loadComments(true);
      }

      function wireCommentClicks() {
        if (!commentsList) return;
        commentsList.addEventListener("click", async (e) => {
          const reportCBtn = e.target.closest("[data-creport]");
          if (reportCBtn) {
            await reportContent({ commentId: reportCBtn.getAttribute("data-creport"), storyId: storyId }, true);
            return;
          }
          const editBtn = e.target.closest("[data-cedit]");
          const delBtn = e.target.closest("[data-cdel]");
          const saveBtn = e.target.closest("[data-csave]");
          const cancelBtn = e.target.closest("[data-ccancel]");

          if (editBtn) {
            editingCommentId = editBtn.getAttribute("data-cedit");
            renderComments();
            const ta = document.getElementById("comment-edit-input");
            if (ta) ta.focus();
            return;
          }
          if (cancelBtn) { editingCommentId = null; renderComments(); return; }
          if (saveBtn) {
            const id = saveBtn.getAttribute("data-csave");
            const ta = document.getElementById("comment-edit-input");
            const body = ta ? ta.value.trim() : "";
            if (!body) return;
            const { data, error } = await supabase
              .from("story_comments").update({ body })
              .eq("id", id).eq("user_id", currentUser.id)
              .select().single();
            if (!error && data) {
              comments = comments.map((x) => (String(x.id) === String(id) ? data : x));
              editingCommentId = null;
              renderComments();
              setCommentStatus(tx("Comment saved.", "تم حفظ التعليق."), false);
            }
            return;
          }
          if (delBtn) {
            const id = delBtn.getAttribute("data-cdel");
            if (!window.confirm(tx("Delete your comment?", "هل تريد حذف تعليقك؟"))) return;
            const { data, error } = await supabase
              .from("story_comments").delete()
              .eq("id", id).eq("user_id", currentUser.id)
              .select("id");
            if (!error && data && data.length) {
              comments = comments.filter((x) => String(x.id) !== String(id));
              renderComments();
              setCommentStatus(tx("Comment deleted.", "تم حذف التعليق."), false);
            }
          }
        });
      }

      function wireOwnerMenu() {
        if (ownerMenuBtn) {
          ownerMenuBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (ownerMenu) ownerMenu.classList.toggle("open");
          });
        }
        document.addEventListener("click", (e) => {
          if (ownerMenu && ownerMenu.classList.contains("open") &&
              !ownerMenu.contains(e.target) && e.target !== ownerMenuBtn) {
            closeOwnerMenu();
          }
        });
        if (ownerEditBtn) {
          ownerEditBtn.addEventListener("click", () => {
            closeOwnerMenu();
            if (!storyData) return;
            editTitleInput.value = storyData.title || "";
            editContentInput.value = storyData.content || "";
            setStoryStatus("", false);
            if (editForm) editForm.classList.add("open");
          });
        }
        if (ownerDeleteBtn) {
          ownerDeleteBtn.addEventListener("click", () => { closeOwnerMenu(); deleteStory(); });
        }
        if (editSaveBtn) editSaveBtn.addEventListener("click", saveStoryEdit);
        if (editCancelBtn) {
          editCancelBtn.addEventListener("click", () => {
            if (editForm) editForm.classList.remove("open");
          });
        }
        if (commentsRefreshBtn) commentsRefreshBtn.addEventListener("click", () => loadComments(true));
        if (commentsMoreBtn) commentsMoreBtn.addEventListener("click", () => loadComments(false));
        if (commentBtn) commentBtn.addEventListener("click", () => {
          commentsExpanded = !commentsExpanded;
          renderComments();
          if (commentsExpanded && commentsSection && commentsSection.scrollIntoView) commentsSection.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        if (commentsToggleBtn) commentsToggleBtn.addEventListener("click", () => { commentsExpanded = false; renderComments(); });
        if (commentsViewAllBtn) commentsViewAllBtn.addEventListener("click", () => { commentsExpanded = true; renderComments(); });
        if (commentPostBtn) commentPostBtn.addEventListener("click", postComment);
        if (commentInput) {
          commentInput.addEventListener("input", () => {
            commentPostBtn.disabled = !(commentInput.value || "").trim();
            commentInput.style.height = "auto";
            commentInput.style.height = Math.min(commentInput.scrollHeight, 110) + "px";
          });
        }
      }

      function setCommentPlaceholder() {
        if (commentInput) commentInput.setAttribute("placeholder", tx("Your comment", "تعليقك"));
        if (shareMessageInput) shareMessageInput.setAttribute("placeholder", tx("Add a short note (optional)", "أضف ملاحظة قصيرة (اختياري)"));
      }

      function renderMedia(data) {
        if (!mediaHost) return;

        const url = data && (data.media_url || "");
        const mediaType = data && (data.media_type || "");

        if (!url) {
          mediaHost.style.display = "none";
          mediaHost.innerHTML = "";
          return;
        }

        const u = HarmonySite.safeMediaURL(url);
        if (!u) { mediaHost.replaceChildren(); mediaHost.style.display = "none"; return; }
        const lower = u.toLowerCase();
        const isVideo =
          mediaType.toLowerCase().includes("video") ||
          lower.endsWith(".mp4") || lower.endsWith(".webm") || lower.endsWith(".mov") || lower.endsWith(".m4v");
        const isImage =
          mediaType.toLowerCase().includes("image") ||
          lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".gif") || lower.endsWith(".webp");

        let html = '<div class="media-wrap">';
        if (isVideo) {
          html += '<video controls preload="metadata" src="' + escapeHtml(u) + '"></video>';
        } else if (isImage) {
          html += '<img src="' + escapeHtml(u) + '" alt="Story media" />';
        } else {
          html += '<img src="' + escapeHtml(u) + '" alt="Story media" />';
        }
        html += '<div class="media-caption">' +
          (currentLang === "ar" ? "مرفق" : "Attachment") +
          '</div></div>';

        mediaHost.innerHTML = html;
        mediaHost.style.display = "block";
      }

      async function loadStory() {
        storyId = getIdFromUrl();

        if (!storyId) {
          elTitle.textContent = currentLang === "ar" ? "قصة غير موجودة" : "Story not found";
          showError("Missing story id in the URL.", "لا يوجد رقم قصة في الرابط.");
          return;
        }

        try {
          let { data, error } = await supabase
            .from("stories")
            .select("*")
            .eq("id", storyId)
            .maybeSingle();

          if (error) {
            console.error("Supabase error:", error);
            elTitle.textContent = currentLang === "ar" ? "تعذر التحميل" : "Could not load";
            showError("Error loading this story (check console).", "خطأ في تحميل القصة (تحقق من الكونسول).");
            return;
          }

          if (!data) {
            elTitle.textContent = currentLang === "ar" ? "قصة غير موجودة" : "Story not found";
            showError("This story does not exist (or was deleted).", "هذه القصة غير موجودة (أو تم حذفها).");
            return;
          }

          elError.style.display = "none";

          elCategory.textContent = data.category || (currentLang === "ar" ? "عام" : "General");
          elTitle.textContent = data.title || (currentLang === "ar" ? "بدون عنوان" : "Untitled");
          elDate.textContent = formatDate(data.created_at);
          elVisibility.textContent = data.is_anonymous
            ? (currentLang === "ar" ? "مجهول" : "Anonymous")
            : (currentLang === "ar" ? "اسم ظاهر" : "Name visible");
          elContent.textContent = data.content || "";

          storyData = data;

          renderMedia(data);

          try {
            const { data: authData } = await supabase.auth.getUser();
            currentUser = (authData && authData.user) || null;
          } catch (e) { currentUser = null; }
          updateOwnerUI();
          if (socialRow) socialRow.style.display = "block";
          if (sendFriendBtn) sendFriendBtn.style.display = currentUser ? "inline-flex" : "none";
          if (reportBtn) reportBtn.style.display = (currentUser && data.user_id && String(data.user_id) === String(currentUser.id)) ? "none" : "inline-flex";
          await loadReaction();
          await loadAuthor();
          await loadComments(true);

          await refreshUserLabel(currentLang);
        } catch (e) {
          console.error("Unexpected error:", e);
          elTitle.textContent = currentLang === "ar" ? "تعذر التحميل" : "Could not load";
          showError("Something went wrong while loading this story.", "صار خطأ أثناء تحميل القصة.");
        }
      }

      const initialLang = getInitialLang();
      applyLanguage(initialLang);
      setCommentPlaceholder();

      if (langSelect) {
        langSelect.value = initialLang;
        langSelect.addEventListener("change", () => {
          const lang = langSelect.value;
          try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
          applyLanguage(lang);
          setCommentPlaceholder();
          loadStory();
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          const ref = document.referrer || "";
          if (ref.includes("stories.html")) window.history.back();
          else window.location.href = "stories.html";
        });
      }

      wireOwnerMenu();
      wireCommentClicks();
      wireSocial();
      loadStory();
    })();
  </script>
</body>
</html>
