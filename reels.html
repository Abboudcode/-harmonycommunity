<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Reels – Harmony Community</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Watch video stories (Reels) from the Harmony community." />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f5f7fb;
      --bg-card: #ffffff;
      --primary: #4b6fff;
      --primary-soft: #e2e7ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-soft: #e5e7eb;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #eef2ff, #f9fafb 40%);
      color: var(--text-main);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .max-w { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: linear-gradient(180deg, #050817, #0f172a);
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 0;
      gap: 1rem;
    }

    .nav-left { display: flex; align-items: center; gap: 0.5rem; }
    .logo-wrapper { display: flex; align-items: center; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .nav-links a {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-links a:hover { background: rgba(148, 163, 184, 0.22); color: #ffffff; }
    .nav-links a.active { background: rgba(129, 140, 248, 0.35); color: #ffffff; }

    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .nav-ghost { font-size: 0.9rem; color: #cbd5f5; white-space: nowrap; }

    .language-select {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: #e5e7eb;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      outline: none;
      cursor: pointer;
    }

    .language-select option { color: #111827; background: #ffffff; }
    @media (max-width: 720px) { .nav-links { display: none; } }

    main { padding: 2.8rem 0 2.4rem; }

    .center-hero {
      text-align: center;
      max-width: 820px;
      margin: 0 auto 1.4rem;
    }

    .center-hero h1 {
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 0.55rem;
    }

    .center-hero p {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-bottom: 1.1rem;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin: 0.9rem auto 1.6rem;
    }

    .filter-pill {
      border: 1px solid #e5e7eb;
      background: #ffffff;
      color: #334155;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .filter-pill.active { background: #4b6fff; border-color: #4b6fff; color: #ffffff; }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    @media (max-width: 980px) { .stories-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .stories-grid { grid-template-columns: minmax(0, 1fr); } }

    .story-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      padding: 1.15rem;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .story-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.10);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .story-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      background: #eef2ff;
      color: #4f46e5;
      margin-bottom: 0.55rem;
    }

    .story-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .story-snippet {
      color: #374151;
      font-size: 0.92rem;
      margin-bottom: 0.75rem;
      word-break: break-word;
    }

    .story-footer {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 0.4rem;
    }

    .muted-center { text-align: center; color: var(--text-muted); margin-top: 2rem; }

    .reels-wrap { max-width: 520px; margin: 1.5rem auto 0; display: flex; flex-direction: column; gap: 1.25rem; }
    .reel { background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25); }
    .reel video { width: 100%; max-height: 74vh; display: block; background: #000; }
    .reel-info { background: #0b1120; color: #e5e7eb; padding: 0.9rem 1rem 1rem; }
    .reel-tag { display: inline-flex; padding: 0.16rem 0.6rem; border-radius: 999px; font-size: 0.75rem; background: #eef2ff; color: #4f46e5; margin-bottom: 0.45rem; }
    .reel-title { font-weight: 700; font-size: 1.02rem; color: #ffffff; line-height: 1.3; word-break: break-word; }
    .reel-text { font-size: 0.9rem; color: #cbd5e1; margin-top: 0.3rem; word-break: break-word; }
    .reel-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.7rem; font-size: 0.8rem; color: #94a3b8; }
    .reel-open { color: #a5b4fc; font-weight: 700; }
    .reel-social { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; align-items: center; margin-top: 0.55rem; font-size: 0.85rem; color: #e5e7eb; }
    .reel-social a { color: #a5b4fc; font-weight: 600; }
    .reels-cta { display: inline-block; background: #4b6fff; color: #ffffff; font-weight: 700; padding: 0.6rem 1.3rem; border-radius: 999px; }

    footer {
      padding: 1.5rem 0 1.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
    }
  </style>
<link rel="stylesheet" href="site-fixes.css">
</head>

<body>
  <div class="page">
    <header>
      <div class="max-w nav">
        <div class="nav-left">
          <div class="logo-wrapper">
            <!-- ✅ Correct logo (your last correct one) -->
            <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg" aria-label="Harmony logo" role="img">
              <path d="M10 22 C25 5, 55 5, 70 22" fill="none" stroke="#40cbb4" stroke-width="3" stroke-linecap="round" />
              <path d="M12 22 L22 22 L27 15 L33 30 L38 22 L68 22" fill="none" stroke="#f5c451" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              <text x="78" y="27" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Harmony</text>
            </svg>
          </div>
        </div>

        <nav class="nav-links">
          <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a>
          <a href="stories.html" data-en="Stories" data-ar="القصص">Stories</a>
          <a href="reels.html" class="active" data-en="Reels" data-ar="ريلز">Reels</a>
          <a href="share.html" data-en="Share a Story" data-ar="شارك قصة">Share a Story</a>
          <a href="signin.html" data-en="Profile" data-ar="الملف الشخصي">Profile</a>
          <a href="about.html" data-en="About" data-ar="عن هارموني">About</a>
          <a href="faq.html" data-en="FAQ" data-ar="الأسئلة الشائعة">FAQ</a>
          <a href="contact.html" data-en="Contact" data-ar="اتصال">Contact</a>
        </nav>

        <div class="nav-right">
          <select id="language-select" class="language-select" aria-label="Choose language">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
          <div class="nav-ghost" id="nav-auth-label" data-en="Not signed in" data-ar="غير مسجّل الدخول">Not signed in</div>
        </div>
      </div>
    </header>

    <main>
      <div class="max-w">
        <div class="center-hero">
          <h1 data-en="Reels" data-ar="ريلز">Reels</h1>
          <p data-en="Video stories from the community. Videos start muted — use the video controls for sound." data-ar="قصص فيديو من المجتمع. الفيديو يبدأ بدون صوت — استخدم أزرار الفيديو للصوت.">
            Video stories from the community. Videos start muted — use the video controls for sound.
          </p>
        </div>

        <div id="reels-empty" class="muted-center" style="display:none;"></div>
        <div id="reels-cta-wrap" style="display:none;text-align:center;margin-top:1rem;">
          <a href="share.html" class="reels-cta" data-en="Share a video story" data-ar="شارك قصة فيديو">Share a video story</a>
        </div>
        <div id="reels-list" class="reels-wrap"></div>
      </div>
    </main>

    <footer>Harmony Community © 2025</footer>
  </div>

  <script src="site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
  <script src="site-utils.js"></script>

  <script>
    (function () {
      const LANG_KEY = "harmony_lang";

      const langSelect = document.getElementById("language-select");
      const navAuthLabel = document.getElementById("nav-auth-label");
      const reelsList = document.getElementById("reels-list");
      const reelsEmpty = document.getElementById("reels-empty");
      const ctaWrap = document.getElementById("reels-cta-wrap");

      let currentLang = "en";
      let allReels = [];
      let observer = null;

      const CAT_LABELS = {
        Kids: ["Kids", "أطفال"],
        Teens: ["Teens", "مراهقين"],
        Adult: ["Adult", "بالغين"],
        Marriage: ["Marriage", "زواج"],
        Finance: ["Finance", "مال"]
      };

      function getInitialLang() {
        try {
          const saved = localStorage.getItem(LANG_KEY);
          if (saved === "ar" || saved === "en") return saved;
        } catch (e) {}
        return "en";
      }

      function applyLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll("[data-en]").forEach((el) => {
          const en = el.getAttribute("data-en");
          const ar = el.getAttribute("data-ar") || en;
          el.textContent = lang === "ar" ? ar : en;
        });
        document.documentElement.lang = lang === "ar" ? "ar" : "en";
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      }

      function escapeHtml(str) {
        return String(str || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function showMessage(msgEn, msgAr, withCta) {
        if (!reelsEmpty) return;
        reelsEmpty.style.display = "block";
        reelsEmpty.textContent = currentLang === "ar" ? (msgAr || msgEn) : msgEn;
        if (ctaWrap) ctaWrap.style.display = withCta ? "block" : "none";
      }

      function catLabel(category) {
        const pair = CAT_LABELS[category];
        if (!pair) return category || "";
        return currentLang === "ar" ? pair[1] : pair[0];
      }

      function renderReels() {
        if (!reelsList) return;
        if (observer) { observer.disconnect(); observer = null; }
        reelsList.innerHTML = "";

        if (!allReels.length) {
          showMessage(
            "No video stories yet. When someone shares a story with a video, it will show up here.",
            "لا توجد قصص فيديو بعد. عندما يشارك أحد قصة فيها فيديو، ستظهر هنا.",
            true
          );
          return;
        }
        if (reelsEmpty) reelsEmpty.style.display = "none";
        if (ctaWrap) ctaWrap.style.display = "none";

        allReels.forEach((s) => {
          const snippet = (s.content || "").length > 220 ? s.content.slice(0, 220) + "…" : (s.content || "");
          const card = document.createElement("div");
          card.className = "reel";
          card.innerHTML = `
            <video controls playsinline loop muted preload="metadata" data-story-id="${String(s.id)}" src="${escapeHtml(s._safeUrl)}"></video>
            <div class="reel-info">
              <div class="reel-tag">${escapeHtml(catLabel(s.category))}</div>
              <div class="reel-title">${escapeHtml(s.title || "")}</div>
              <div class="reel-text">${escapeHtml(snippet)}</div>
              <div class="reel-social" data-social-for="${String(s.id)}"></div>
              <div class="reel-footer">
                <span>${s.is_anonymous ? (currentLang === "ar" ? "مجهول" : "Anonymous") : (currentLang === "ar" ? "عضو" : "Member")} · ${escapeHtml(formatDate(s.created_at))}</span>
                <a class="reel-open" href="story.html?id=${encodeURIComponent(String(s.id))}">${currentLang === "ar" ? "افتح القصة" : "Open story"}</a>
              </div>
            </div>
          `;
          reelsList.appendChild(card);
        });

        // Play the reel on screen, pause the rest (muted autoplay, like other reels feeds).
        // The first time a reel comes into view, record one view for it.
        if ("IntersectionObserver" in window) {
          observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              const v = entry.target;
              if (entry.isIntersecting) {
                const p = v.play(); if (p && p.catch) p.catch(() => {});
                const sid = v.getAttribute("data-story-id");
                if (sid && !viewedIds.has(sid)) { viewedIds.add(sid); recordView(sid); }
              }
              else { v.pause(); }
            });
          }, { threshold: 0.55 });
          reelsList.querySelectorAll("video").forEach((v) => observer.observe(v));
        }
        loadSocial();
      }

      const supabase = window.HarmonySite.client;

      async function refreshUserLabel(langOverride) {
        const lang = langOverride || currentLang;
        try {
          const { data, error } = await supabase.auth.getUser();
          if (error || !data || !data.user) {
            if (navAuthLabel) {
              const en = navAuthLabel.getAttribute("data-en") || "Not signed in";
              const ar = navAuthLabel.getAttribute("data-ar") || en;
              navAuthLabel.textContent = lang === "ar" ? ar : en;
            }
            return;
          }
          const user = data.user;
          currentUserId = user.id;
          const meta = user.user_metadata || {};
          const displayName = meta.display_name || "Member";
          const alwaysAnon = !!meta.always_anonymous;
          navAuthLabel.textContent = alwaysAnon
            ? (lang === "ar" ? "مسجّل: مجهول (الاسم مخفي)" : "Signed in: Anonymous (name hidden)")
            : (lang === "ar" ? "مسجّل: " + displayName : "Signed in: " + displayName);
        } catch (e) {}
      }


      const REACTION_EMOJI = { like: "👍", love: "❤️", happened_to_me: "🤝", support: "🫂", wow: "😮", sad: "😢" };
      const socialByStory = {};
      const viewedIds = new Set();
      let currentUserId = null;

      function socialLine(id) {
        const m = socialByStory[String(id)] || { total: 0, byKind: {}, comments: 0, views: 0 };
        const parts = [];
        const kinds = Object.entries(m.byKind).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
        if (kinds.length) parts.push(kinds.map(([k, n]) => (REACTION_EMOJI[k] || "") + " " + n).join(" · "));
        else parts.push((currentLang === "ar" ? "لا تفاعلات بعد" : "No reactions yet"));
        parts.push("💬 " + m.comments);
        parts.push("👁 " + m.views);
        return parts.join("   ");
      }

      function paintSocial() {
        document.querySelectorAll("[data-social-for]").forEach((el) => {
          el.textContent = socialLine(el.getAttribute("data-social-for"));
        });
      }

      async function loadSocial() {
        const ids = allReels.map((s) => s.id);
        if (!ids.length) return;
        ids.forEach((id) => { socialByStory[String(id)] = { total: 0, byKind: {}, comments: 0, views: 0 }; });
        try {
          const { data } = await supabase.from("story_reactions").select("story_id, kind").in("story_id", ids);
          (data || []).forEach((r) => {
            const m = socialByStory[String(r.story_id)]; if (!m) return;
            m.total += 1; m.byKind[r.kind] = (m.byKind[r.kind] || 0) + 1;
          });
        } catch (e) {}
        try {
          const { data } = await supabase.from("story_comments").select("story_id").in("story_id", ids);
          (data || []).forEach((c) => { const m = socialByStory[String(c.story_id)]; if (m) m.comments += 1; });
        } catch (e) {}
        try {
          const { data } = await supabase.from("story_views").select("story_id").in("story_id", ids);
          (data || []).forEach((v) => { const m = socialByStory[String(v.story_id)]; if (m) m.views += 1; });
        } catch (e) {}
        paintSocial();
      }

      async function recordView(storyId) {
        const m = socialByStory[String(storyId)];
        if (m) { m.views += 1; paintSocial(); }
        try { await supabase.from("story_views").insert({ story_id: Number(storyId), viewer_id: currentUserId }); } catch (e) {}
      }

      async function loadReels() {
        try {
          let { data, error } = await supabase
            .from("stories")
            .select("id, title, content, category, is_anonymous, created_at, media_url, media_type")
            .order("created_at", { ascending: false })
            .limit(60);

          if (error) {
            // Older tables without media columns simply have no reels yet.
            allReels = [];
            renderReels();
            return;
          }

          const rows = Array.isArray(data) ? data : [];
          allReels = rows
            .map((s) => ({ ...s, _safeUrl: window.HarmonySite.safeMediaURL(s.media_url) }))
            .filter((s) => s._safeUrl && String(s.media_type || "").indexOf("video") === 0);
          renderReels();
        } catch (e) {
          console.error("Unexpected error:", e);
          showMessage("Error loading reels (check console).", "خطأ في تحميل الريلز (تحقق من الكونسول).", false);
        }
      }

      const initialLang = getInitialLang();
      applyLanguage(initialLang);

      if (langSelect) {
        langSelect.value = initialLang;
        langSelect.addEventListener("change", () => {
          const lang = langSelect.value;
          try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
          applyLanguage(lang);
          refreshUserLabel(lang);
          renderReels();
        });
      }

      refreshUserLabel(initialLang);
      loadReels();
    })();
  </script>
</body>
</html>
